# Forge 运行时配置（默认档）。Stage 代码通过 ctx.cfg("a.b.c") 读取；
# `--profile <name>` 会叠加 configs/<name>.toml；`--param config_overrides='{...}'` 可临时覆盖。

[run]
seed = 20260912

[gates]
lint_required = ["ruff_check", "ruff_format", "mypy"]
mypy_paths = ["forge"]

[paper]
main = "main.tex"
# 需在同一 run 中已完成的 stage；其 tables/*.tex 与 figures/*.pdf|png 会被并入排版
sources = ["figures", "tables"]
max_body_pages = 30
max_overfull_pt = 20.0
code_globs = [
  "forge/**/*.py", "pipelines/**/*.py", "tools/**/*.py", "tests/**/*.py",
  "configs/*.toml", "configs/*.json", "Makefile", "pyproject.toml",
]

[qa]
required_stages = ["lint", "test"]
results_stage = "results"
require_results = true
identity_denylist = []                       # 硬门禁（正则）：出现即失败
identity_watchlist = ["大学", "学院", "赛区", "队号", "指导教师", "[\\w.-]+@[\\w.-]+\\.\\w+"]   # 软提示：写入报告供复核

[package]
stages = ["ingest", "validate", "q1", "q2", "q3", "q4", "convergence", "verification", "sensitivity", "extension", "derived", "results", "figures", "tables", "lint", "test", "qa"]
code_globs = [
  "forge/**/*.py", "pipelines/**/*.py", "tools/**/*.py", "tests/**/*.py", "configs/**",
  "manuscript/**/*.tex", "manuscript/**/*.bib", "docs/**/*.md", "Makefile", "pyproject.toml",
  "README.md", "UNLICENSE", "AI_USAGE.md",
]
max_bytes = 20971520

[release]
paper_name = "论文.pdf"

# ---- Problem A: herb drying (see docs/mdr/) ----
[a.grid]
refine = 5                 # production grid: dr = 0.1 / 2^refine cm (nodes coincide with the 0.1 cm output grid)
convergence_levels = 7     # k = 0 … levels-1 in the convergence study

[a.time]
method = "BDF"
rtol = 1e-9
atol = 1e-11

[a.chamber]
plateau = "mean_last_hour" # constant-temperature stage after 14400 s (MDR-0003): mean_last_hour | last_sample | nominal

[a.scheme]
face = "midpoint"          # interface coefficient: midpoint | arithmetic | harmonic (MDR-0004)
formulation = "lagrangian" # moving boundary: lagrangian (dry matter conserved) | eulerian (MDR-0006)

[a.drying]
horizon_s = 432000         # first integration horizon for the drying-end search (5 days), doubled if needed
dt_out_s = 60

[a.verification]
axisym_nz = 25             # axial intervals of the independent 2-D model (dz = 0.5 cm)
axisym_refine = 0          # radial refinement of the 2-D model (dr = 0.1 cm)

[a.sensitivity]
factors = [0.8, 0.9, 1.1, 1.2]
workers = 8

[a.extension]              # model-evaluation extension (MDR-0008), problem-3 setting
cap_factors = [0.5, 1.0, 2.0]   # multiples of the wet-bulb energy limit h (T_air - T_wb)/L_v on the evaporation flux
c_eq = [0.075, 0.10, 0.125]     # equilibrium moisture replacing C_air in the driving force C_s - C_eq
